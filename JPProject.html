<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>League Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: "PremierSans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #38003c 0%, #00ff85 100%);
      margin: 0;
      padding: 2rem 1rem;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 1200px;
      background: #ffffff;
      border-radius: 0;
      padding: 0;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
      border: none;
    }
    h1 {
      margin: 0;
      padding: 1.5rem 2rem;
      text-align: left;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38003c 0%, #e90052 100%);
      color: #ffffff;
      border-bottom: 4px solid #00ff85;
    }
    .subtitle {
      text-align: center;
      margin-bottom: 0;
      padding: 1rem 2rem;
      font-size: 0.9rem;
      color: #38003c;
      background: #f4f4f4;
      border-bottom: 1px solid #e0e0e0;
      font-weight: 600;
    }
    .table-wrapper {
      overflow-x: auto;
      border-radius: 0;
      border: none;
      background: #ffffff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }
    thead {
      background: #38003c;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th, td {
      padding: 1rem 1.25rem;
      text-align: left;
      font-size: 0.9rem;
      border-bottom: 1px solid #e0e0e0;
      white-space: nowrap;
    }
    td:first-child {
      font-weight: 700;
      color: #38003c;
      text-align: center;
      font-size: 1rem;
      background: #f9f9f9;
    }
    .club-name {
      font-weight: 700;
      color: #38003c;
      font-size: 0.95rem;
    }
    .stat-number {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: #38003c;
    }
    .form-indicator {
      display: inline-block;
      width: 1.4rem;
      height: 1.4rem;
      border-radius: 2px;
      text-align: center;
      line-height: 1.4rem;
      font-size: 0.7rem;
      font-weight: 700;
      margin: 0 2px;
    }
    .form-w { background: #00ff85; color: #38003c; }
    .form-d { background: #999999; color: #ffffff; }
    .form-l { background: #e90052; color: #ffffff; }
    th {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: #ffffff;
      padding: 1rem 1.25rem;
    }
    tbody tr {
      background: #ffffff;
      transition: background 0.2s ease;
    }
    tbody tr:nth-child(even) {
      background: #f9f9f9;
    }
    tbody tr:hover {
      background: #f0e6ff;
    }
    tbody tr:first-child {
      background: linear-gradient(90deg, rgba(0, 255, 133, 0.1), rgba(255, 255, 255, 0));
    }
    tbody tr:first-child td {
      border-top: 3px solid #00ff85;
      font-weight: 700;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: #e90052;
      border: none;
      color: #ffffff;
      font-weight: 700;
    }
    .footer {
      margin-top: 0;
      padding: 1rem 2rem;
      font-size: 0.8rem;
      color: #666666;
      text-align: right;
      background: #f4f4f4;
      border-top: 1px solid #e0e0e0;
      font-weight: 600;
    }
    .error {
      margin: 1rem 2rem;
      color: #e90052;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>League Stats</h1>
    <p class="subtitle">
      Live stats synced from the league spreadsheet
      <span class="badge">Auto-updating</span>
    </p>

    <div class="table-wrapper">
      <table id="stats-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <p class="footer" id="last-updated"></p>
    <p class="error" id="error-message"></p>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2zHnWn0w2AZ2TpbBniTby96VlZuU0pwk35nUD1XFmoRd8eVHLUaQd3To1a0c-jQ/pub?gid=850902682&single=true&output=csv"; // <- paste your published CSV link here

    async function loadStats() {
      const errorEl = document.getElementById("error-message");
      const tableHead = document.querySelector("#stats-table thead");
      const tableBody = document.querySelector("#stats-table tbody");
      const lastUpdatedEl = document.getElementById("last-updated");

      errorEl.textContent = "";
      tableHead.innerHTML = "";
      tableBody.innerHTML = "";

      try {
        // Use a CORS proxy to avoid cross-origin issues when opening file locally
        const proxyUrl = "https://api.allorigins.win/raw?url=";
        const fullUrl = proxyUrl + encodeURIComponent(CSV_URL + "&t=" + Date.now());

        const response = await fetch(fullUrl);
        if (!response.ok) {
          throw new Error("Network response was not ok (Status: " + response.status + ")");
        }
        const csvText = await response.text();

        // Simple CSV parsing assuming no commas inside values
        const rows = csvText
          .trim()
          .split("\n")
          .map(row => row.split(","));

        if (rows.length === 0) {
          errorEl.textContent = "No data found in the sheet.";
          return;
        }

        const headers = rows[0];
        const dataRows = rows.slice(1);

        // Build header row
        const headerRow = document.createElement("tr");
        headers.forEach(h => {
          const th = document.createElement("th");
          th.textContent = h.trim();
          headerRow.appendChild(th);
        });
        tableHead.appendChild(headerRow);

        // Build data rows
        dataRows.forEach(row => {
          if (row.length === 1 && row[0].trim() === "") return; // skip empty
          const tr = document.createElement("tr");
          row.forEach((cell, index) => {
            const td = document.createElement("td");
            let value = cell.trim();
            const header = headers[index].trim().toLowerCase();

            // Position column (first column) - already styled via CSS
            if (index === 0) {
              td.textContent = value;
            }
            // Club column (second column)
            else if (index === 1) {
              td.className = "club-name";
              td.textContent = value;
            }
            // Form column (last column) - display as colored indicators
            else if (header === "form" || header === "last 5") {
              const formChars = value.split("");
              formChars.forEach(char => {
                const span = document.createElement("span");
                span.className = "form-indicator";
                const upperChar = char.toUpperCase();
                if (upperChar === "W") span.className += " form-w";
                else if (upperChar === "D") span.className += " form-d";
                else if (upperChar === "L") span.className += " form-l";
                span.textContent = upperChar;
                td.appendChild(span);
              });
            }
            // Number columns - align right
            else if (!isNaN(value) && value !== "") {
              td.className = "stat-number";
              td.textContent = value;
            }
            // Other columns
            else {
              td.textContent = value;
            }

            tr.appendChild(td);
          });
          tableBody.appendChild(tr);
        });

        const now = new Date();
        lastUpdatedEl.textContent =
          "Last refreshed: " + now.toLocaleString();

      } catch (err) {
        console.error("Detailed error:", err);
        errorEl.textContent =
          "Error: " + err.message + " - Check your CSV link and sharing settings. See console for details.";
      }
    }

    document.addEventListener("DOMContentLoaded", loadStats);
  </script>
</body>
</html>
