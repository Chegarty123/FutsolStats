<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Iona Futsal League</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="site-nav" class="nav"></header>

  <main class="page">
    <div class="hero">
      <p class="eyebrow">Season <span data-season></span></p>
      <h1 id="league-name">Iona Futsal League</h1>
      <p class="lede">Standings, top scorers and Player of the Week — straight from the league sheet.</p>
      <p id="status" class="status" aria-live="polite"></p>
    </div>
    <section id="content" class="section"></section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/futsal.js"></script>
  <script>
    const { el, num, gPlusA, teamBadge, leaders, namesLabel, message, config } = Futsal;
    document.getElementById("league-name").textContent = config.leagueName;

    function tile(href, label, value, detail) {
      return el("a", { class: "tile", href },
        el("span", { class: "tile-label", text: label }),
        value ? el("span", { class: "tile-value", text: value.text }) : null,
        el("span", { class: "tile-detail" }, detail));
    }
    const emptyTile = (href, label, text, detail) =>
      el("a", { class: "tile", href },
        el("span", { class: "tile-label", text: label }),
        el("span", { class: "tile-value empty", text }),
        el("span", { class: "tile-detail", text: detail }));

    function leaderTile(standings) {
      const href = "standings.html";
      if (!standings) return emptyTile(href, "League leader", "Unavailable", "Couldn't load the table");
      const started = standings.some((t) => num(t.mp) > 0);
      if (!started || !standings.length) return emptyTile(href, "League leader", "No matches yet", `${standings.length} teams ready to go`);
      const top = standings[0];
      return tile(href, "League leader", { text: top.club }, `${num(top.pts)} pts · ${num(top.mp)} played`);
    }

    function statTile(players, label, valueOf, unit) {
      const href = "PlayerStats.html";
      if (!players) return emptyTile(href, label, "Unavailable", "Couldn't load player stats");
      const lead = leaders(players, valueOf);
      if (!lead) return emptyTile(href, label, "No goals yet", "Be the first on the board");
      const team = lead.rows.length === 1 && lead.rows[0].team;
      return tile(href, label, { text: namesLabel(lead.rows) }, [`${lead.value} ${unit}`, team && teamBadge(team)]);
    }

    function potwTile(potw) {
      const href = "PlayerOfTheWeek.html";
      if (!potw) return emptyTile(href, "Player of the week", "Unavailable", "Couldn't load winners");
      if (!potw.length) return emptyTile(href, "Player of the week", "Not picked yet", "First winner after week 1");
      const p = potw[potw.length - 1];
      return tile(href, "Player of the week", { text: p.player }, [p.week && `Week ${p.week}`, p.team && teamBadge(p.team)]);
    }

    function miniTable(standings) {
      if (!standings) return message("error", "Couldn't load the table");
      if (!standings.length) return message("empty", "No teams yet");
      const started = standings.some((t) => num(t.mp) > 0);
      return el("div", { class: "table-wrap" }, el("table", null,
        el("thead", null, el("tr", null,
          el("th", { text: "#" }), el("th", { class: "left", text: "Club" }),
          el("th", { text: "MP" }), el("th", { text: "GD" }), el("th", { text: "Pts" }))),
        el("tbody", null, standings.map((t, i) => el("tr", { class: started && i === 0 ? "leader" : null },
          el("td", { class: "rank", text: t.position || i + 1 }),
          el("td", { class: "left name" }, teamBadge(t.club)),
          el("td", { text: num(t.mp) }),
          el("td", { text: Futsal.signed(t.gd) }),
          el("td", { class: "strong", text: num(t.pts) }))))));
    }

    function topPlayers(players) {
      if (!players) return message("error", "Couldn't load player stats");
      const top = players.filter((p) => gPlusA(p) > 0)
        .sort((a, b) => gPlusA(b) - gPlusA(a) || num(b.goals) - num(a.goals))
        .slice(0, 5);
      if (!top.length) return message("empty", "No goals yet", "The leaderboard fills in after the first match.");
      return el("div", { class: "table-wrap" }, el("table", null,
        el("thead", null, el("tr", null,
          el("th", { class: "left", text: "Player" }), el("th", { class: "left hide-xs", text: "Team" }),
          el("th", { text: "G" }), el("th", { text: "A" }), el("th", { text: "G+A" }))),
        el("tbody", null, top.map((p) => el("tr", null,
          el("td", { class: "left name", text: p.player }),
          el("td", { class: "left hide-xs" }, teamBadge(p.team)),
          el("td", { text: num(p.goals) }),
          el("td", { text: num(p.assists) }),
          el("td", { class: "strong", text: gPlusA(p) }))))));
    }

    Futsal.page({
      active: "home",
      tabs: ["standings", "players", "potw"],
      render(main, { standings, players, potw }) {
        main.replaceChildren(
          el("div", { class: "tiles" },
            leaderTile(standings),
            statTile(players, "Top scorer", (p) => num(p.goals), "goals"),
            statTile(players, "Most goal involvements", gPlusA, "G+A"),
            potwTile(potw)),
          el("div", { class: "split section" },
            el("div", null,
              el("div", { class: "section-head" }, el("h2", { text: "Table" }), el("a", { href: "standings.html", text: "Full standings →" })),
              miniTable(standings)),
            el("div", null,
              el("div", { class: "section-head" }, el("h2", { text: "Top 5 players" }), el("a", { href: "PlayerStats.html", text: "All players →" })),
              topPlayers(players))),
        );
      },
    });
  </script>
</body>
</html>
