<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Player of the Week · Iona Futsal League</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="site-nav" class="nav"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <p class="eyebrow">Season <span data-season></span></p>
        <h1>Player of the Week</h1>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </div>
    <section id="content"></section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/futsal.js"></script>
  <script>
    const { el, num, gPlusA, teamBadge, message } = Futsal;

    function meta(p) {
      return el("div", { class: "meta" },
        p.week && el("span", { text: `Week ${p.week}` }),
        p.date && el("span", { text: p.date }),
        p.team && teamBadge(p.team));
    }

    Futsal.page({
      active: "potw",
      tabs: ["potw"],
      render(main, { potw }) {
        if (!potw.length) {
          main.replaceChildren(message("empty", "No Player of the Week yet",
            "The first winner gets announced after week 1. Check back soon."));
          return;
        }
        const [latest, ...past] = [...potw].reverse();
        const stat = (label, value, hl) =>
          el("div", { class: "stat" + (hl ? " hl" : "") },
            el("div", { class: "stat-label", text: label }),
            el("div", { class: "stat-value", text: value }));

        main.replaceChildren(
          el("article", { class: "feature" },
            el("p", { class: "eyebrow", text: "★ Latest winner" }),
            el("h2", { class: "feature-name", text: latest.player }),
            meta(latest),
            el("div", { class: "stats-row" },
              stat("Goals", num(latest.goals)),
              stat("Assists", num(latest.assists)),
              stat("G + A", gPlusA(latest), true))),

          !past.length ? "" : el("section", { class: "section" },
            el("div", { class: "section-head" }, el("h2", { text: "Past winners" })),
            el("div", { class: "history" },
              past.map((p) => el("article", { class: "card" },
                el("p", { class: "eyebrow", text: p.week ? `Week ${p.week}` : p.date || "" }),
                el("h3", { text: p.player }),
                el("div", { class: "meta" }, p.team && teamBadge(p.team), p.week && p.date && el("span", { text: p.date })),
                el("p", { class: "line" },
                  el("b", { text: num(p.goals) }), " G · ",
                  el("b", { text: num(p.assists) }), " A · ",
                  el("b", { text: gPlusA(p) }), " G+A"))))),
        );
      },
    });
  </script>
</body>
</html>
