<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script>try { if (localStorage.getItem("futsal:theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
  <title>Player Stats · Iona Futsal League</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="css/styles.css?v=202611111752" />
</head>
<body>
  <header id="site-nav" class="nav"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <p class="eyebrow">Season <span data-season></span></p>
        <h1>Player Stats</h1>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </div>
    <section id="content"></section>
  </main>

  <script src="js/config.js?v=202611111752"></script>
  <script src="js/futsal.js?v=202611111752"></script>
  <script>
    const { el, num, gPlusA, rating, ratingBadge, teamBadge, message } = Futsal;

    const SORTS = {
      player: { label: "Player", value: (p) => p.player.toLowerCase(), defaultDir: "asc", cls: "left" },
      goals: { label: "Goals", short: "G", value: (p) => num(p.goals), defaultDir: "desc" },
      assists: { label: "Assists", short: "A", value: (p) => num(p.assists), defaultDir: "desc" },
      ga: { label: "G+A", value: gPlusA, defaultDir: "desc" },
      latest: { label: "Latest rating", short: "Last", value: (p) => rating(p.latest), defaultDir: "desc" },
      season: { label: "Season rating", short: "Rtg", value: (p) => rating(p.season), defaultDir: "desc" },
    };

    // UI state survives auto-refreshes
    const state = { query: "", team: "all", sort: "ga", dir: "desc", players: [] };
    let ui = null;

    function buildUI(main) {
      const search = el("input", {
        class: "search", type: "search", placeholder: "Find a player…", "aria-label": "Find a player",
        oninput: (e) => { state.query = e.target.value; drawTable(); },
      });
      const chips = el("div", { class: "chips", role: "group", "aria-label": "Filter by team" });
      const count = el("span", { class: "count", "aria-live": "polite" });
      const thead = el("thead");
      const tbody = el("tbody");
      const notice = el("div");
      main.replaceChildren(
        notice,
        el("div", { class: "controls" }, search, chips, count),
        el("div", { class: "table-wrap" }, el("table", { class: "compact-teams" }, thead, tbody)),
        el("p", { class: "legend", text: "Ranked by goals + assists. Ratings are out of 10 (latest game and season average); – means not rated yet. Tap a column to sort." }),
      );
      ui = { chips, count, thead, tbody, notice };
    }

    function drawChips() {
      const teams = [...new Set(state.players.map((p) => p.team).filter(Boolean))].sort();
      if (state.team !== "all" && !teams.includes(state.team)) state.team = "all";
      const chip = (value, child) => el("button", {
        class: "chip", type: "button", "aria-pressed": String(state.team === value),
        onclick: () => { state.team = value; drawChips(); drawTable(); },
      }, child);
      ui.chips.replaceChildren(chip("all", "All teams"), ...teams.map((t) => chip(t, teamBadge(t))));
    }

    function drawHead() {
      const sortTh = (key) => {
        const s = SORTS[key];
        const active = state.sort === key;
        return el("th", {
          scope: "col", class: s.cls || null,
          "aria-sort": active ? (state.dir === "asc" ? "ascending" : "descending") : null,
        }, el("button", {
          type: "button",
          onclick: () => {
            if (state.sort === key) state.dir = state.dir === "asc" ? "desc" : "asc";
            else { state.sort = key; state.dir = s.defaultDir; }
            drawHead(); drawTable();
          },
        }, s.short
          ? [el("span", { class: "hide-sm", text: s.label }), el("span", { class: "show-sm", "aria-hidden": "true", text: s.short })]
          : s.label));
      };
      ui.thead.replaceChildren(el("tr", null,
        el("th", { scope: "col", title: "Rank by G+A", text: "#" }),
        sortTh("player"),
        el("th", { scope: "col", class: "left", text: "Team" }),
        sortTh("goals"), sortTh("assists"), sortTh("ga"), sortTh("latest"), sortTh("season")));
    }

    function drawTable() {
      const { players } = state;
      const q = state.query.trim().toLowerCase();
      const s = SORTS[state.sort];
      const dir = state.dir === "asc" ? 1 : -1;

      const rows = players
        .filter((p) => state.team === "all" || p.team === state.team)
        .filter((p) => !q || p.player.toLowerCase().includes(q))
        .sort((a, b) => {
          const va = s.value(a), vb = s.value(b);
          if (va !== vb) {
            if (va == null) return 1; // unrated players always sink to the bottom
            if (vb == null) return -1;
            return (va > vb ? 1 : -1) * dir;
          }
          return gPlusA(b) - gPlusA(a) || num(b.goals) - num(a.goals) || a.player.localeCompare(b.player);
        });

      ui.count.textContent = `Showing ${rows.length} of ${players.length} players`;
      if (!rows.length) {
        ui.tbody.replaceChildren(el("tr", null, el("td", { colspan: 8, class: "muted", text: "No players match that search." })));
        return;
      }
      ui.tbody.replaceChildren(...rows.map((p) => {
        const r = p._rank;
        return el("tr", { class: r && r <= 3 ? "top" : null },
          el("td", { class: "rank", text: r || "–" }),
          el("td", { class: "left name", text: p.player }),
          el("td", { class: "left" }, teamBadge(p.team)),
          el("td", { text: num(p.goals) }),
          el("td", { text: num(p.assists) }),
          el("td", { class: "strong", text: gPlusA(p) }),
          el("td", null, ratingBadge(p.latest)),
          el("td", null, ratingBadge(p.season)));
      }));
    }

    Futsal.page({
      active: "players",
      tabs: ["players"],
      render(main, { players }) {
        if (!players.length) {
          ui = null;
          main.replaceChildren(message("empty", "No players yet", "Players will show up once they're added to the league sheet."));
          return;
        }
        // Standard competition ranking by G+A (1, 2, 2, 4…); no rank until a player has a goal involvement.
        const byGA = [...players].sort((a, b) => gPlusA(b) - gPlusA(a));
        byGA.forEach((p, i) => {
          const prev = byGA[i - 1];
          p._rank = gPlusA(p) <= 0 ? null : prev && gPlusA(prev) === gPlusA(p) ? prev._rank : i + 1;
        });
        state.players = players;

        if (!ui || !main.contains(ui.thead)) buildUI(main);
        const anyGoals = players.some((p) => gPlusA(p) > 0);
        ui.notice.replaceChildren(!anyGoals ? message("info", "No goals yet this season", "Rankings appear once the first goals and assists are logged.") : "");
        drawChips(); drawHead(); drawTable();
      },
    });
  </script>
</body>
</html>
