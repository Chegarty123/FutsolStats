<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-deep: #050014;
      --bg-mid: #1a0030;
      --bg-top: #38003c;
      --accent: #e90052;
      --accent-soft: #ff4fa3;
      --table-header: #ff0a84;
      --row-even: #17002a;
      --row-odd: #21003d;
      --row-hover: #3a005a;
      --text-main: #ffffff;
    }

    body {
      font-family: "PremierSans", -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #5b008f 0, transparent 40%),
        radial-gradient(circle at bottom right, #ff007f33 0, transparent 55%),
        linear-gradient(135deg, var(--bg-top) 0%, var(--bg-deep) 60%, #000000 100%);
      margin: 0;
      padding: 2.5rem 1.25rem;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: rgba(10, 0, 30, 0.96);
      border-radius: 16px;
      padding: 0;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      padding: 1.6rem 2rem;
      text-align: left;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 1.9rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--table-header), var(--bg-top));
      color: #ffffff;
      border-bottom: 3px solid #ffd4f0;
    }

    .subtitle {
      text-align: left;
      padding: 0.9rem 2rem 1.1rem;
      font-size: 0.9rem;
      color: #f8def9;
      background: rgba(10, 0, 30, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      background: #21003d;
      color: #ffd4f0;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .table-wrapper {
      overflow-x: auto;
      background: transparent;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    thead {
      background: var(--table-header);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th,
    td {
      padding: 0.9rem 1.2rem;
      text-align: center;
      font-size: 0.88rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      white-space: nowrap;
      color: #f9e8ff;
    }

    th {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #ffffff;
    }

    th:first-child,
    td:first-child {
      text-align: center;
    }

    td:first-child {
      font-weight: 800;
      color: #ffffff;
      background: #2a003f;
    }

    td:nth-child(2) {
      text-align: left;
      font-weight: 700;
      color: #ffffff;
      font-size: 0.95rem;
    }

    tbody tr {
      background: var(--row-odd);
      transition: background 0.15s ease;
    }

    tbody tr:nth-child(even) {
      background: var(--row-even);
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    tbody tr:nth-child(1),
    tbody tr:nth-child(2),
    tbody tr:nth-child(3) {
      background: linear-gradient(
        90deg,
        rgba(255, 10, 132, 0.8),
        rgba(58, 0, 90, 0.95)
      );
    }

    tbody tr:first-child td:first-child {
      border-top: 3px solid #ffe4ff;
    }

    .team-badge {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .team-red { background: #e90052; color: #ffffff; }
    .team-blue { background: #38003c; color: #ffffff; }
    .team-black { background: #000000; color: #ffffff; }
    .team-white { background: #ffffff; color: #38003c; border: 2px solid #38003c; }

    .stat-number {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #ffe4ff;
    }

    .stat-highlight {
      color: #00ff85;
      font-weight: 900;
      font-size: 1.05rem;
    }

    .footer {
      margin-top: 0;
      padding: 0.8rem 2rem 1.1rem;
      font-size: 0.78rem;
      color: #f2cfff;
      text-align: right;
      background: #12001f;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 500;
    }

    .error {
      margin: 0.75rem 2rem 1.5rem;
      color: #ff7da8;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 720px) {
      h1 {
        font-size: 1.6rem;
        padding-inline: 1.4rem;
      }
      .subtitle,
      .footer,
      .error {
        padding-inline: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Player Stats</h1>
    <p class="subtitle">
      <span>Top scorers ranked by Goals + Assists</span>
      <span class="badge">Auto-updating</span>
    </p>

    <div class="table-wrapper">
      <table id="stats-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <p class="footer" id="last-updated"></p>
    <p class="error" id="error-message"></p>
  </div>

  <script>
    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2zHnWn0w2AZ2TpbBniTby96VlZuU0pwk35nUD1XFmoRd8eVHLUaQd3To1a0c-jQ/pub?gid=1385558400&single=true&output=csv";

    async function loadStats() {
      const errorEl = document.getElementById("error-message");
      const tableHead = document.querySelector("#stats-table thead");
      const tableBody = document.querySelector("#stats-table tbody");
      const lastUpdatedEl = document.getElementById("last-updated");

      errorEl.textContent = "";
      tableHead.innerHTML = "";
      tableBody.innerHTML = "";
      lastUpdatedEl.textContent = "Loading data...";

      try {
        const proxyUrl = "https://api.allorigins.win/raw?url=";
        const fullUrl = proxyUrl + encodeURIComponent(CSV_URL + "&t=" + Date.now());

        const response = await fetch(fullUrl);
        if (!response.ok) {
          throw new Error("Network response was not ok (Status: " + response.status + ")");
        }
        const csvText = await response.text();

        // Parse CSV properly handling line breaks
        const lines = csvText.trim().split(/\r?\n/);
        const rows = lines.map(line => {
          const cells = [];
          let current = '';
          let inQuotes = false;

          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
              inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
              cells.push(current.trim());
              current = '';
            } else if (char !== '\r') {
              current += char;
            }
          }
          cells.push(current.trim());
          return cells;
        });

        if (rows.length === 0) {
          errorEl.textContent = "No data found in the sheet.";
          return;
        }

        // First row is header
        const headers = ["Rank", ...rows[0]];

        // Collect data rows (skip header)
        const dataRows = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];

          // Stop if we hit a fully empty row
          if (row.every(cell => !cell || cell.trim() === "")) break;

          // Skip rows with no player name
          if (!row[0] || row[0].trim() === "") continue;

          dataRows.push(row);
        }

        if (dataRows.length === 0) {
          errorEl.textContent = "No valid player rows found.";
          return;
        }

        // Sort by G+A (column index 4) in descending order
        dataRows.sort((a, b) => {
          const aValue = parseFloat(a[4]) || 0;
          const bValue = parseFloat(b[4]) || 0;
          return bValue - aValue;
        });

        // Build header row
        const headerTr = document.createElement("tr");
        headers.forEach(h => {
          const th = document.createElement("th");
          th.textContent = h;
          headerTr.appendChild(th);
        });
        tableHead.appendChild(headerTr);

        // Build data rows
        dataRows.forEach((row, rowIndex) => {
          const tr = document.createElement("tr");

          // Rank column
          const rankTd = document.createElement("td");
          rankTd.textContent = rowIndex + 1;
          tr.appendChild(rankTd);

          // Player, Team, Goals, Assists, G+A
          row.forEach((cell, index) => {
            const td = document.createElement("td");
            const value = (cell || "").trim();

            if (index === 0) {
              // Player name
              td.textContent = value;
            } else if (index === 1) {
              // Team badge
              const teamBadge = document.createElement("span");
              teamBadge.className = "team-badge";
              const teamLower = value.toLowerCase();
              if (teamLower === "red") teamBadge.className += " team-red";
              if (teamLower === "blue") teamBadge.className += " team-blue";
              if (teamLower === "black") teamBadge.className += " team-black";
              if (teamLower === "white") teamBadge.className += " team-white";
              teamBadge.textContent = value;
              td.appendChild(teamBadge);
            } else {
              // Numeric stats (Goals, Assists, G+A)
              td.className = "stat-number";
              // Highlight G+A column (index 4)
              if (index === 4) td.className += " stat-highlight";
              td.textContent = value;
            }

            tr.appendChild(td);
          });

          tableBody.appendChild(tr);
        });

        const now = new Date();
        lastUpdatedEl.textContent = "Last refreshed: " + now.toLocaleString();
      } catch (err) {
        console.error("Detailed error:", err);
        errorEl.textContent =
          "Error: " + err.message + " - Check your CSV link and sharing settings.";
      }
    }

    document.addEventListener("DOMContentLoaded", loadStats);
  </script>
</body>
</html>
