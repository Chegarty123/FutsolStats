<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player Stats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: "PremierSans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #38003c 0%, #00ff85 100%);
      margin: 0;
      padding: 2rem 1rem;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      background: #ffffff;
      border-radius: 0;
      padding: 0;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
      border: none;
    }
    h1 {
      margin: 0;
      padding: 1.5rem 2rem;
      text-align: left;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38003c 0%, #e90052 100%);
      color: #ffffff;
      border-bottom: 4px solid #00ff85;
    }
    .subtitle {
      text-align: center;
      margin-bottom: 0;
      padding: 1rem 2rem;
      font-size: 0.9rem;
      color: #38003c;
      background: #f4f4f4;
      border-bottom: 1px solid #e0e0e0;
      font-weight: 600;
    }
    .table-wrapper {
      overflow-x: auto;
      border-radius: 0;
      border: none;
      background: #ffffff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }
    thead {
      background: #38003c;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th, td {
      padding: 1rem 1.25rem;
      text-align: left;
      font-size: 0.9rem;
      border-bottom: 1px solid #e0e0e0;
      white-space: nowrap;
    }
    td:first-child {
      font-weight: 700;
      color: #38003c;
      font-size: 0.95rem;
    }
    .rank {
      display: inline-block;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: #e90052;
      border: none;
      color: #ffffff;
      text-align: center;
      line-height: 2rem;
      font-size: 0.85rem;
      font-weight: 700;
      margin-right: 0.75rem;
    }
    .rank.top3 {
      background: #00ff85;
      color: #38003c;
      font-weight: 900;
      font-size: 0.9rem;
    }
    .player-cell {
      display: flex;
      align-items: center;
    }
    .team-badge {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .team-red { background: #e90052; color: #ffffff; border: none; }
    .team-blue { background: #38003c; color: #ffffff; border: none; }
    .team-black { background: #000000; color: #ffffff; border: none; }
    .team-white { background: #ffffff; color: #38003c; border: 2px solid #38003c; }
    .stat-number {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #38003c;
      font-size: 0.95rem;
    }
    .stat-highlight {
      color: #e90052;
      font-weight: 900;
      font-size: 1.1rem;
    }
    th {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: #ffffff;
      text-align: center;
      padding: 1rem 1.25rem;
    }
    th:first-child {
      text-align: left;
    }
    tbody tr {
      background: #ffffff;
      transition: background 0.2s ease;
    }
    tbody tr:nth-child(even) {
      background: #f9f9f9;
    }
    tbody tr:hover {
      background: #f0e6ff;
    }
    tbody tr:first-child {
      background: linear-gradient(90deg, rgba(0, 255, 133, 0.15), rgba(255, 255, 255, 0));
    }
    tbody tr:first-child td {
      border-top: 3px solid #00ff85;
    }
    tbody tr:nth-child(2) {
      background: linear-gradient(90deg, rgba(0, 255, 133, 0.1), rgba(255, 255, 255, 0));
    }
    tbody tr:nth-child(3) {
      background: linear-gradient(90deg, rgba(0, 255, 133, 0.05), rgba(255, 255, 255, 0));
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: #e90052;
      border: none;
      color: #ffffff;
      font-weight: 700;
    }
    .footer {
      margin-top: 0;
      padding: 1rem 2rem;
      font-size: 0.8rem;
      color: #666666;
      text-align: right;
      background: #f4f4f4;
      border-top: 1px solid #e0e0e0;
      font-weight: 600;
    }
    .error {
      margin: 1rem 2rem;
      color: #e90052;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Player Stats</h1>
    <p class="subtitle">
      Top scorers ranked by goals
      <span class="badge">Auto-updating</span>
    </p>

    <div class="table-wrapper">
      <table id="stats-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <p class="footer" id="last-updated"></p>
    <p class="error" id="error-message"></p>
  </div>

  <script>
    // Google Sheets CSV export of the tab that has both tables
    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vR2zHnWn0w2AZ2TpbBniTby96VlZuU0pwk35nUD1XFmoRd8eVHLUaQd3To1a0c-jQ/pub?gid=304346052&single=true&output=csv";
  
    // columns for the RIGHT table: Player, Team, Goals, Assists, G + A
    const START_COL = 6;  // column G (0-based index)
    const END_COL   = 11; // column K (exclusive)
  
    async function loadStats() {
      const errorEl = document.getElementById("error-message");
      const tableHead = document.querySelector("#stats-table thead");
      const tableBody = document.querySelector("#stats-table tbody");
      const lastUpdatedEl = document.getElementById("last-updated");
  
      errorEl.textContent = "";
      tableHead.innerHTML = "";
      tableBody.innerHTML = "";
  
      try {
        // CORS proxy so it works when opened locally
        const proxyUrl = "https://api.allorigins.win/raw?url=";
        const fullUrl = proxyUrl + encodeURIComponent(CSV_URL + "&t=" + Date.now());
  
        const response = await fetch(fullUrl);
        if (!response.ok) {
          throw new Error("Network response was not ok (Status: " + response.status + ")");
        }
        const csvText = await response.text();
  
        // Basic CSV parse (works since your sheet has simple values)
        const rows = csvText
          .trim()
          .split("\n")
          .map(row => row.split(","));
  
        if (rows.length === 0) {
          errorEl.textContent = "No data found in the sheet.";
          return;
        }
  
        // 1) Find the header row for the RIGHT table (Player | Team | Goals | Assists | G + A)
        let headerRowIndex = rows.findIndex(row =>
          row[START_COL] &&
          row[START_COL].trim().toLowerCase() === "player" &&
          row[START_COL + 1] &&
          row[START_COL + 1].trim().toLowerCase() === "team"
        );
  
        // fallback: if not found for some reason, use first row
        if (headerRowIndex === -1) headerRowIndex = 0;
  
        const headerCells = rows[headerRowIndex].slice(START_COL, END_COL);
        const headers = ["Rank", ...headerCells.map(h => h.trim())];
  
        // 2) Collect only the continuous block under that header
        const dataRows = [];
        for (let i = headerRowIndex + 1; i < rows.length; i++) {
          const slice = rows[i].slice(START_COL, END_COL);
  
          // stop if we hit a fully empty row (end of the table)
          if (slice.every(cell => !cell || cell.trim() === "")) break;
  
          // skip rows with no player name
          if (!slice[0] || slice[0].trim() === "") continue;
  
          // skip Google Sheets error values (#VALUE!, #REF!, etc.)
          if (slice.some(cell => cell && cell.includes("#"))) continue;
  
          dataRows.push(slice);
        }
  
        if (dataRows.length === 0) {
          errorEl.textContent = "No valid player rows found in the right-hand table.";
          return;
        }
  
        // 3) Build header row
        const headerRow = document.createElement("tr");
        headers.forEach(h => {
          const th = document.createElement("th");
          th.textContent = h;
          headerRow.appendChild(th);
        });
        tableHead.appendChild(headerRow);
  
        // 4) Build data rows with Rank + styling
        dataRows.forEach((row, rowIndex) => {
          const tr = document.createElement("tr");
  
          // Rank column
          const rankTd = document.createElement("td");
          const rankSpan = document.createElement("span");
          rankSpan.className = rowIndex < 3 ? "rank top3" : "rank";
          rankSpan.textContent = rowIndex + 1;
          const playerCellDiv = document.createElement("div");
          playerCellDiv.className = "player-cell";
          playerCellDiv.appendChild(rankSpan);
          playerCellDiv.appendChild(document.createTextNode(row[0].trim())); // Player
          rankTd.appendChild(playerCellDiv);
          tr.appendChild(rankTd);
  
          // Team, Goals, Assists, G + A
          row.slice(1).forEach((cell, index) => {
            const td = document.createElement("td");
            const value = (cell || "").trim();
  
            if (index === 0) {
              // Team badge
              const teamBadge = document.createElement("span");
              teamBadge.className = "team-badge";
              const teamLower = value.toLowerCase();
              if (teamLower === "red")   teamBadge.className += " team-red";
              if (teamLower === "blue")  teamBadge.className += " team-blue";
              if (teamLower === "black") teamBadge.className += " team-black";
              if (teamLower === "white") teamBadge.className += " team-white";
              teamBadge.textContent = value;
              td.appendChild(teamBadge);
              td.style.textAlign = "center";
            } else if (!isNaN(value) && value !== "") {
              // Numeric stats
              td.className = "stat-number";
              // last column (G + A) is highlighted
              if (index === 3) td.className += " stat-highlight";
              td.textContent = value;
            } else {
              td.textContent = value;
            }
  
            tr.appendChild(td);
          });
  
          tableBody.appendChild(tr);
        });
  
        const now = new Date();
        lastUpdatedEl.textContent = "Last refreshed: " + now.toLocaleString();
      } catch (err) {
        console.error("Detailed error:", err);
        const errorEl = document.getElementById("error-message");
        errorEl.textContent =
          "Error: " + err.message + " - Check your CSV link and sharing settings. See console for details.";
      }
    }
  
    document.addEventListener("DOMContentLoaded", loadStats);
  </script>  
</body>
</html>
